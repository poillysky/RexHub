<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>RexHub iOS · 影视 / 播放器</title>
<style>
  :root{
    --bg:#05070c; --surface:#1c1c1e; --surface-alt:#2c2c2e;
    --text:#f5f5f7; --text2:#98989d; --text3:#6c6c70;
    --border:rgba(84,84,88,.38); --brand:#0a84ff; --danger:#ff453a;
    --radius:12px;
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  html,body{margin:0;background:#0b0d12;}
  body{
    font-family:-apple-system,"SF Pro Text","PingFang SC",Inter,sans-serif;
    color:var(--text);
    width:914px; padding:40px 40px 32px;
  }
  .board{display:flex; gap:48px; justify-content:center;}
  .col{display:flex; flex-direction:column; gap:14px;}
  .caption{font-size:12px; letter-spacing:.14em; color:#6c6c70; text-transform:uppercase;}

  .phone{
    width:393px; height:852px; position:relative; overflow:hidden;
    border-radius:48px; background:var(--bg);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 40px 80px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
    display:flex; flex-direction:column;
  }
  .phone::after{
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:48px;
    background:linear-gradient(160deg, rgba(255,255,255,.045), transparent 22%);
  }

  /* status bar */
  .status{height:54px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 28px; font-size:14px; font-weight:600;}
  .status .right{display:flex; align-items:center; gap:5px;}
  .bars{display:flex; align-items:flex-end; gap:2px; height:10px;}
  .bars i{display:block; width:3px; background:#f5f5f7; border-radius:1px;}
  .bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
  .bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}
  .batt{width:22px;height:11px;border:1px solid rgba(245,245,247,.5);border-radius:3px;position:relative;}
  .batt::before{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:70%;background:#f5f5f7;border-radius:1.5px;}
  .batt::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:rgba(245,245,247,.5);border-radius:0 1px 1px 0;}

  /* ============ 影视 ============ */
  .head{flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:6px 20px 14px;}
  .head h1{margin:0; font-size:34px; line-height:34px; letter-spacing:-.02em; font-weight:700;}
  .avatar{width:34px;height:34px;border-radius:999px;background:linear-gradient(140deg,#3b6ea8,#1d3350);border:1px solid rgba(255,255,255,.12);}

  .filters{flex:none; display:flex; gap:8px; padding:0 20px 20px;}
  .chip{height:32px; padding:0 14px; border-radius:999px; display:flex; align-items:center;
        font-size:13px; color:var(--text2); background:var(--surface); border:1px solid var(--border);}
  .chip.on{background:var(--brand); border-color:transparent; color:#fff; font-weight:600;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 13px; padding:0 20px;}
  .card{display:flex; flex-direction:column; gap:8px;}
  .art{position:relative; width:100%; aspect-ratio:1/1.33; border-radius:var(--radius); overflow:hidden; background:var(--surface-alt);}
  .art .fill{position:absolute; inset:0;}
  .art .veil{position:absolute; inset:0; background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.14), transparent 55%),
      linear-gradient(to top, rgba(5,7,12,.55), transparent 55%);}
  .badge{position:absolute; left:8px; bottom:8px; height:20px; padding:0 7px; border-radius:6px;
         background:rgba(0,0,0,.55); backdrop-filter:blur(8px); font-size:10px; font-weight:600;
         display:flex; align-items:center; color:#fff; letter-spacing:.02em;}
  .badge.brand{background:rgba(10,132,255,.9);}
  .t{font-size:15px; line-height:20px; font-weight:600;}
  .m{font-size:12px; line-height:16px; color:var(--text2);}

  .spacer{flex:1 1 0; min-height:0;}

  /* tab bar */
  .tabbar{flex:none; height:84px; padding:10px 10px 22px; display:flex; justify-content:space-around;
          background:rgba(28,28,30,.92); border-top:1px solid rgba(255,255,255,.06);}
  .tab{width:64px; display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--text3);}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .tab span{font-size:10px; font-weight:500;}
  .tab.on{color:var(--brand);}
  .homebar{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:rgba(245,245,247,.85);}

  /* ============ 播放器 ============ */
  .player{background:#000;}
  .pstatus{opacity:.85;}
  .ptop{flex:none; display:flex; align-items:center; justify-content:space-between; padding:2px 20px 12px;}
  .iconbtn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
           background:rgba(255,255,255,.08);}
  .iconbtn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;}
  .ptitle{text-align:center; line-height:1.25;}
  .ptitle b{display:block; font-size:15px; font-weight:600;}
  .ptitle i{font-style:normal; font-size:11px; color:var(--text3);}

  .stage{flex:none; margin:0 20px; width:353px; height:198px; border-radius:var(--radius); position:relative; overflow:hidden;
         background:linear-gradient(160deg,#1b2a45,#070a10); border:1px solid rgba(255,255,255,.06);}
  .stage .veil{position:absolute; inset:0; background:
      radial-gradient(80% 70% at 50% 30%, rgba(120,160,220,.20), transparent 65%),
      linear-gradient(to top, rgba(0,0,0,.6), transparent 50%);}
  .playbig{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px;height:64px;border-radius:999px;
           background:rgba(255,255,255,.16); backdrop-filter:blur(10px); display:flex;align-items:center;justify-content:center;
           border:1px solid rgba(255,255,255,.22);}
  .playbig svg{width:22px;height:22px;fill:#fff;}
  .subtitle{position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:14px; line-height:1.4;
            text-shadow:0 1px 6px rgba(0,0,0,.9);}
  .pill{position:absolute; right:10px; top:10px; height:22px; padding:0 9px; border-radius:999px; font-size:11px;
        font-weight:600; background:rgba(0,0,0,.5); display:flex; align-items:center; color:#fff;}

  .pbody{flex:none; padding:22px 20px 0;}
  .progress{height:4px; border-radius:2px; background:rgba(255,255,255,.16); position:relative;}
  .progress .buf{position:absolute; left:0; top:0; bottom:0; width:52%; background:rgba(255,255,255,.22); border-radius:2px;}
  .progress .done{position:absolute; left:0; top:0; bottom:0; width:37%; background:var(--brand); border-radius:2px;}
  .progress .knob{position:absolute; left:37%; top:50%; width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:999px;
                  background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.5);}
  .times{display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--text2);
         font-variant-numeric:tabular-nums;}

  .controls{flex:none; display:flex; align-items:center; justify-content:space-between; padding:18px 34px 6px;}
  .ctl{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;}
  .ctl svg{width:24px;height:24px;fill:#fff;}
  .ctl.ring{position:relative; width:44px;height:44px;}
  .ctl.ring svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:1.6;}
  .ctl.ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600;}
  .ctl.main{width:56px;height:56px;border-radius:999px;background:#fff;}
  .ctl.main svg{fill:#000;width:22px;height:22px;}

  .row2{flex:none; display:flex; justify-content:space-between; padding:16px 20px 0; gap:8px;}
  .pchip{flex:1; height:34px; border-radius:10px; background:rgba(255,255,255,.08); display:flex;
         align-items:center; justify-content:center; gap:6px; font-size:12px; color:var(--text); }
  .pchip svg{width:13px;height:13px;stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .pfoot{flex:none; padding:18px 20px 34px; display:flex; justify-content:space-between; font-size:11px; color:var(--text3);}
</style>
</head>
<body>
