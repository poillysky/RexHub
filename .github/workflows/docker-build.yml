name: Build & Push Image

# 构建 server/ 单镜像（web 3020 + api 8020）并推送到 Docker Hub。
# 构建上下文 = server/，与 server/Dockerfile 一致。
#
# 触发：
#   1) push 到 main
#   2) 手动触发（可指定 tag）
#   3) 打 git tag：v1.2.28 → 镜像 tag 1.2.28 / v1.2.28 / latest / main
#
# 需要的 repo secrets：
#   DOCKERHUB        Docker Hub Access Token（不是登录密码）
#   用户名直接用 poillysky（下方 USERNAME 常量），无需单独 secret。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '额外镜像 tag（留空则用 1.2.28）'
        required: false
        default: ''

env:
  IMAGE_NAME: poillysky/sehua-next-web
  USERNAME: poillysky
  DEFAULT_VERSION: '1.2.28'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || env.DEFAULT_VERSION }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.USERNAME }}
          password: ${{ secrets.DOCKERHUB }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
